<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f5d3a" />
    <meta name="description" content="Spincio: gioco di carte 2 contro 2 con mazzo piacentino, contro la CPU." />
    <title>Spincio</title>
    <script>
        // GitHub Pages serves a project site under /<repo>/; locally the app lives at /.
        // Computed here (not rewritten at deploy) so index.html keeps the hash the service worker checks.
        (function () {
            var match = location.pathname.match(/^\/[^/]+\//);
            var base = location.hostname.endsWith('github.io') && match ? match[0] : '/';
            document.write('<base href="' + base + '" />');
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="update-bar" role="status" hidden>
        <span>È pronta una nuova versione di Spincio. La partita in corso resta salvata.</span>
        <button type="button" class="update-now">Aggiorna</button>
        <button type="button" class="update-later" aria-label="Più tardi">✕</button>
    </div>

    <div id="blazor-error-ui">
        Si è verificato un errore imprevisto.
        <a href="." class="reload">Ricarica</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // Show the error's first line inside the error bar, so a screenshot from the phone is enough to diagnose it.
        (function () {
            let last = '';
            const original = console.error;
            console.error = function (...args) { last = args.map(String).join(' ').split('\n').slice(0, 3).join(' | '); original.apply(console, args); };
            const bar = document.getElementById('blazor-error-ui');
            new MutationObserver(() => {
                if (bar.style.display === 'block' && last) {
                    let detail = bar.querySelector('.detail');
                    if (!detail) { detail = document.createElement('small'); detail.className = 'detail'; bar.appendChild(detail); }
                    detail.textContent = last.slice(0, 300);
                }
            }).observe(bar, { attributes: true, attributeFilter: ['style'] });
        })();
    </script>
    <script src="js/moves.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Updates. The installed app keeps serving the version it cached for offline play: a new version downloads in the
        // background and waits. As soon as it is ready, a bar offers "Aggiorna", which hands over to it and reloads.
        // iOS resumes home-screen apps without reloading them, so look for a new version every time the app comes back.
        (function () {
            if (!('serviceWorker' in navigator)) return;
            const bar = document.getElementById('update-bar');
            let waiting = null, reloading = false;
            const offer = worker => { waiting = worker; bar.hidden = false; };
            bar.querySelector('.update-now').addEventListener('click', () => waiting && waiting.postMessage('skipWaiting'));
            bar.querySelector('.update-later').addEventListener('click', () => { bar.hidden = true; });
            navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloading) { reloading = true; location.reload(); } });
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(reg => {
                if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
                reg.addEventListener('updatefound', () => {
                    const worker = reg.installing;
                    worker && worker.addEventListener('statechange', () => {
                        if (worker.state === 'installed' && navigator.serviceWorker.controller) offer(worker);
                    });
                });
                document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => { }); });
            });
        })();
    </script>
</body>

</html>
