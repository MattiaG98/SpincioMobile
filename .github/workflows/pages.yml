name: Deploy to GitHub Pages

# Publishes the offline PWA (ADR 0006). Runs only from main: pull requests are covered by ci.yml.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test Spincio.slnx -c Release

      - name: Publish client
        run: dotnet publish src/Spincio.Client -c Release -o publish

      - name: Prepare static site
        run: |
          # SPA fallback for unknown paths; the base href is computed at runtime in index.html.
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          # _framework must not be treated as a Jekyll private folder.
          touch publish/wwwroot/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
